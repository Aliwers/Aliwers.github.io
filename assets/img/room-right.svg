<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" fill="none" role="img">
<title>Серый персидский кот, волнистый попугай в клетке и домашние цветы</title>
<defs>
  <linearGradient id="furG" x1=".2" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#8f97a3"/><stop offset=".55" stop-color="#6a7079"/><stop offset="1" stop-color="#41464e"/>
  </linearGradient>
  <linearGradient id="bellyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9c0c9"/><stop offset="1" stop-color="#7d848d"/>
  </linearGradient>
  <linearGradient id="potG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8d4a28"/><stop offset=".55" stop-color="#b26437"/><stop offset="1" stop-color="#6d3720"/>
  </linearGradient>
  <radialGradient id="shadowG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="eyeG" cx=".4" cy=".35" r=".7">
    <stop offset="0" stop-color="#d6ffbe"/><stop offset="1" stop-color="#5fa842"/>
  </radialGradient>
</defs>

<ellipse cx="210" cy="452" rx="150" ry="28" fill="url(#shadowG)"/>
<ellipse cx="452" cy="462" rx="120" ry="20" fill="url(#shadowG)"/>
<ellipse cx="66" cy="458" rx="66" ry="16" fill="url(#shadowG)"/>

<!-- Полка с традесканцией: плети свисают до самого пола -->
<g transform="translate(6 40)">
  <rect x="0" y="150" width="132" height="10" rx="3" fill="#3b2a1c"/>
  <path d="M26 150 V126 Q26 112 44 112 H88 Q106 112 106 126 V150 Z" fill="#7d5233"/>
  <path d="M26 132 H106" stroke="#a06a41" stroke-width="4" opacity=".7"/>
