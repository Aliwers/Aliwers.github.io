<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картридж</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  .fail {
    display: grid; place-content: center; height: 100%; padding: 8%;
    color: #ff6169; font: 12px/2 "Courier New", monospace; text-align: center;
  }
</style>
</head>
<body>
<div id="game"></div>
<script>
  // Изолированная страница под эмулятор: одна игра — одна загрузка,
  // никакого демонтажа состояния между картриджами.
  const params = new URLSearchParams(location.search);
  const rom = params.get("rom");
  const name = params.get("name") || "Картридж";

  if (!rom) {
    document.getElementById("game").innerHTML =
      '<div class="fail">НЕТ КАРТРИДЖА<br>ROM не передан</div>';
  } else {
    window.EJS_player = "#game";
    window.EJS_core = "segaMD";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_gameUrl = rom;
    window.EJS_gameName = name;
    window.EJS_language = "ru";
    window.EJS_color = "#ff2f38";
    window.EJS_backgroundColor = "#000000";
    window.EJS_startOnLoaded = true;
    window.EJS_startButtonName = "СТАРТ";
    /* Без этого EmulatorJS берёт -legacy сборку ядра: в отчёте ядра на CDN
       поле options пустое, и WebGL2 остаётся выключенным. Там, где WebGL2
       не поддерживается, эмулятор сам вернётся на legacy. */
    window.EJS_defaultOptions = { webgl2Enabled: "enabled" };

    /* Сборка stable, а не latest: в ядрах latest не экспортирована
       EmulatorJSGetState, и сохранение падало с FAILED TO SAVE STATE.
       Русского словаря в stable нет, поэтому берём его из latest —
       единственный файл, который подменяется. */
    const cdnFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const url = String(input && input.url ? input.url : input);
      return url.includes("/stable/data/localization/")
        ? cdnFetch(url.replace("/stable/", "/latest/"), init)
        : cdnFetch(input, init);
    };

    const s = document.createElement("script");
    s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    s.onerror = () => {
      document.getElementById("game").innerHTML =
        '<div class="fail">НЕТ СВЯЗИ С CDN<br>эмулятор не загрузился<br>проверьте интернет</div>';
    };
    document.body.appendChild(s);
  }

  /* Стрелки и пробел — это геймпад, а не прокрутка. Страница под iframe
     не скроллится, поэтому браузер уводил прокрутку на родительскую. */
  const PAD_KEYS = new Set([
    "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
    "Space", "PageUp", "PageDown", "Home", "End",
  ]);

  addEventListener("keydown", (e) => {
    if (!PAD_KEYS.has(e.code)) return;
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    e.preventDefault();
  }, { capture: true });
</script>
</body>
</html>
