    <circle cx="32" cy="-33" r="6"/><circle cx="30" cy="-50" r="5"/><circle cx="39" cy="-48" r="5"/>
  </g>
  <g fill="#f06a63" opacity=".8"><circle cx="29" cy="-46" r="2.6"/><circle cx="37" cy="-41" r="2.4"/></g>
</g>
</svg>
