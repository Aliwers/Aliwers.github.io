<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картридж</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  .fail {
    display: grid; place-content: center; height: 100%; padding: 8%;
    color: #ff6169; font: 12px/2 "Courier New", monospace; text-align: center;
  }
</style>
</head>
<body>
<div id="game"></div>
<script>
  // Изолированная страница под эмулятор: одна игра — одна загрузка,
  // никакого демонтажа состояния между картриджами.
  const params = new URLSearchParams(location.search);
  const rom = params.get("rom");
  const name = params.get("name") || "Картридж";

  if (!rom) {
    document.getElementById("game").innerHTML =
      '<div class="fail">НЕТ КАРТРИДЖА<br>ROM не передан</div>';
  } else {
    window.EJS_player = "#game";
    window.EJS_core = "segaMD";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
    window.EJS_gameUrl = rom;
    window.EJS_gameName = name;
    window.EJS_language = "ru";
    window.EJS_color = "#ff2f38";
    window.EJS_backgroundColor = "#000000";
    window.EJS_startOnLoaded = true;
    window.EJS_startButtonName = "СТАРТ";

    const s = document.createElement("script");
    s.src = "https://cdn.emulatorjs.org/latest/data/loader.js";
    s.onerror = () => {
      document.getElementById("game").innerHTML =
        '<div class="fail">НЕТ СВЯЗИ С CDN<br>эмулятор не загрузился<br>проверьте интернет</div>';
    };
    document.body.appendChild(s);
  }
</script>
</body>
</html>
