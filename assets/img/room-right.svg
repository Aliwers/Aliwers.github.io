  <g fill="#4e8248">
    <ellipse cx="6" cy="-6" rx="17" ry="13"/><ellipse cx="60" cy="-4" rx="17" ry="13"/>
    <ellipse cx="32" cy="6" rx="15" ry="12"/><ellipse cx="18" cy="-24" rx="14" ry="11"/>
    <ellipse cx="48" cy="-26" rx="14" ry="11"/>
  </g>
  <g fill="#d2342f">
