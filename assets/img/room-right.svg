  <g stroke="#5a3b22" stroke-width="7" stroke-linecap="round"><path d="M-18 102 V132M74 102 V132"/></g>
  <path d="M2 40 H62 L54 92 Q52 98 44 98 H20 Q12 98 10 92 Z" fill="url(#potG)"/>
  <path d="M-4 32 H68 Q74 32 74 38 V48 Q74 54 68 54 H-4 Q-10 54 -10 48 V38 Q-10 32 -4 32 Z" fill="#a75c31"/>
